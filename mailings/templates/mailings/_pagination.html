{% if is_paginated %}
  <nav class="pagination">
    {% if page_obj.has_previous %}
      <a href="?page={{ page_obj.previous_page_number }}{% if query_status %}&status={{ query_status }}{% endif %}">Назад</a>
    {% endif %}
    <span>{{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a href="?page={{ page_obj.next_page_number }}{% if query_status %}&status={{ query_status }}{% endif %}">Вперёд</a>
    {% endif %}
  </nav>
{% endif %}
