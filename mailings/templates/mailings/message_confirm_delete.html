{% extends "base.html" %}

{% block title %}Удалить сообщение — Сервис рассылок{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Удалить сообщение?</h1>
  <p>
    «{{ object.subject }}» будет удалено. Если сообщение используется
    в рассылке, удалить его нельзя.
  </p>

  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button class="button button-danger" type="submit">Удалить</button>
      <a class="button button-secondary" href="{% url 'mailings:message_list' %}">Отмена</a>
    </div>
  </form>
</section>
{% endblock %}
